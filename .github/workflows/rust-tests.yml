name: Rust Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # stable

      - name: Run tests
        run: cargo test --locked

  windows-tests:
    name: cargo test (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # stable
        with:
          components: clippy

      - name: Run updater tests on Windows
        run: 'cargo test --locked --no-default-features --features update --bin xfetch update::'

      - name: Run all tests on Windows
        run: cargo test --locked

      - name: Run clippy on Windows
        run: cargo clippy --all-targets -- -D warnings
