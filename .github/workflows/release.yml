name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Refuse to build a release unless the tag is a reviewed, tested commit on
  # main and the version in Cargo.toml matches the tag.
  gate:
    name: Gate (tag ancestry, version, tests, audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit is on main
        run: |
          set -euo pipefail
          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "::error::origin/main is not available; cannot verify tag ancestry."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not an ancestor of origin/main."
            echo "Releases must be tagged from commits that were merged into main."
            exit 1
          fi
          echo "Tag commit ${GITHUB_SHA} is on main."

      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(awk '
            /^\[package\]$/ { in_package = 1; next }
            /^\[/          { in_package = 0 }
            in_package && /^version[[:space:]]*=/ {
              gsub(/[",]/, "", $3); print $3; exit
            }
          ' Cargo.toml)"
          if [ -z "${manifest_version}" ]; then
            echo "::error::Could not read version from Cargo.toml."
            exit 1
          fi
          if [ "${tag_version}" != "${manifest_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${manifest_version}."
            exit 1
          fi
          echo "Tag and Cargo.toml agree on ${manifest_version}."

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - name: Run tests
        run: cargo test --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run cargo audit
        run: cargo audit --deny warnings

  build:
    name: Build ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain (linux-musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="${{ matrix.target }}"
          BIN="xfetch"
          [ "$RUNNER_OS" = "Windows" ] && BIN="xfetch.exe"

          mkdir -p stage
          cp "target/${TARGET}/release/${BIN}" "stage/${BIN}"
          cp LICENSE README.md stage/

          if [ "$RUNNER_OS" = "Windows" ]; then
            # GNU tar in Git Bash cannot write ZIP archives: `tar -a` with a
            # .zip name silently produces a plain tar. Use the 7-Zip shipped
            # on the runner instead.
            (cd stage && 7z a -tzip "../xfetch-${VERSION}-${TARGET}.zip" . > /dev/null)
          else
            tar -czf "xfetch-${VERSION}-${TARGET}.tar.gz" -C stage .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: xfetch-*
          if-no-files-found: error

  checksums:
    name: Generate SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          pattern: '*'
          merge-multiple: true

      - name: Validate archives
        run: |
          set -euo pipefail
          cd assets
          for f in *.tar.gz; do
            [ -e "$f" ] || continue
            tar -tzf "$f" > /dev/null
            listing="$(tar -tzf "$f")"
            grep -Eq '(^|/)xfetch$' <<< "$listing" || { echo "$f does not contain xfetch"; exit 1; }
          done
          for f in *.zip; do
            [ -e "$f" ] || continue
            unzip -t "$f" > /dev/null
            listing="$(unzip -Z1 "$f")"
            grep -Eq '(^|/)xfetch\.exe$' <<< "$listing" || { echo "$f does not contain xfetch.exe"; exit 1; }
          done

      - name: Generate checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: assets/SHA256SUMS

  sign:
    name: Sign checksums and attest artifacts
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          pattern: '*'
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SHA256SUMS (keyless OIDC)
        run: |
          set -euo pipefail
          cd assets
          test -s SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.bundle SHA256SUMS
          test -s SHA256SUMS.bundle

      - name: Attest build provenance for release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/*.tar.gz
            assets/*.zip

      - name: Upload signature bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: assets/SHA256SUMS.bundle
          if-no-files-found: error

  release:
    name: Publish release
    needs: sign
    runs-on: ubuntu-latest
    # NOTE: required reviewers / deployment protection rules must be configured
    # for this environment in the repository settings. YAML cannot enforce that.
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          pattern: '*'
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify signature before publishing
        run: |
          set -euo pipefail
          test -s release-assets/SHA256SUMS
          test -s release-assets/SHA256SUMS.bundle
          cosign verify-blob \
            --bundle release-assets/SHA256SUMS.bundle \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            release-assets/SHA256SUMS

      - name: Verify archive checksums before publishing
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          ls -l

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/xfetch-*.tar.gz
            release-assets/xfetch-*.zip
            release-assets/SHA256SUMS
            release-assets/SHA256SUMS.bundle
