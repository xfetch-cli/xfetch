[package]
name = "xfetch-cli"
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "XFetch — a fast, customizable system information fetch tool for the terminal"

[[bin]]
name = "xfetch"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
console = "0.16.2"
crossterm = "0.29.0"
dirs = "6.0.0"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp", "tiff"] }
json_comments = "0.2.2"
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
sysinfo = "0.37.2"
ureq = { version = "2.12", features = ["tls"] }
viuer = { version = "0.11.0", default-features = false }
xfetch-plugin-api = { version = "0.1.0", package = "xfetch-plugin-api" }
xfetch-extension-api = { version = "0.1.0", package = "xfetch-extension-api" }
xfetch-effect-api = { version = "0.1.0", package = "xfetch-effect-api" }
